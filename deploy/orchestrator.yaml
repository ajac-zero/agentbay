apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch
    spec:
      serviceAccountName: dispatch
      containers:
        - name: dispatch
          image: ghcr.io/example/dispatch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: DISPATCH_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DISPATCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dispatch-secrets
                  key: database-url
            - name: DISPATCH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dispatch-secrets
                  key: admin-token
            - name: DISPATCH_DISPATCHER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: dispatch
  ports:
    - name: http
      port: 80
      targetPort: http
